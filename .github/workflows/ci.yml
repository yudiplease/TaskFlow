name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты (linux, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  build-windows:
    name: Десктоп-сборка (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Сборка TaskFlow.exe (GUI, без консоли)
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o bin/TaskFlow.exe ./cmd/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-windows
          path: bin/TaskFlow.exe
